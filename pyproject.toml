[project]
name = "comfyui-sam3dobjects"
description = "ComfyUI wrapper for SAM3DObjects: extract 3D meshes/gaussians from pictures"
version = "0.1.3"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
    "comfy-aimdo",
    "hydra-core>=1.3.2",
    "einops-exts>=0.0.4",
    "roma>=1.5.1",
    "easydict>=1.13",
    "loguru>=0.7.2",
    "utils3d @ https://github.com/EasternJournalist/utils3d/archive/3913c65d81e05e47b9f367250cf8c0f7462a0900.zip",
    "trimesh",
    "fast-simplification>=0.1.0",
    "open3d>=0.18.0",
    "point-cloud-utils>=0.29.5",
    "xatlas>=0.0.9",
    "pyvista>=0.43.0",
    "pymeshfix>=0.16.0",
    "plyfile",
    "pyrender>=0.1.45",
    "PyOpenGL>=3.1.0",
    "opencv-python-headless>=4.9.0",
    "scikit-image>=0.23.1",
    "imageio>=2.36.0",
    "Pillow>=10.0.0",
    "timm>=0.9.16",
    "transformers",
    "diffusers",
    "huggingface-hub",
    "hf_xet",
    "gdown>=5.2.0",
    "addict",
    "omegaconf",
    "python-igraph>=1.0.0",
    "tqdm",
    "psutil>=5.9.0",
    "astor>=0.8.0",
    "optree>=0.11.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0,<2.0",
    "lightning>=2.0.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.9.0",
    "plotly>=5.24.0",
    "gradio>=4.44.0",
    "fvcore",
    "iopath",
    "torchsde",
    "zstandard>=0.22.0",
    "ninja>=1.10.0",
    "jaxtyping",
    "pccm>=0.4.16",
    "ccimport>=0.4.4",
    "comfy-sparse-attn",
    "comfy-3d-viewers==0.2.33",
    "pytorch3d",
    "gsplat",
    "nvdiffrast",
    "flash-attn",
    "sageattention",
    "spconv",
    "cumm",
    "torch",
    "torchvision",
]

[tool.setuptools]
packages = []

[project.urls]
Repository = "https://github.com/PozzettiAndrea/ComfyUI-SAM3DObjects"

[tool.comfy]
PublisherId = "pznodes"
DisplayName = "SAM3DObjects"
Icon = ""

[tool.comfy.isolation]
can_isolate = true
package_manager = "conda"
share_torch = false
conda_channels = ["conda-forge"]
conda_dependencies = []
conda_python = "3.12.*"
sandbox_mode = "disabled"

[tool.comfy.isolation.cuda_wheels]
index_url = "https://pozzettiandrea.github.io/cuda-wheels/"
packages = ["pytorch3d", "gsplat", "nvdiffrast", "flash-attn", "sageattention", "spconv", "cumm"]

[tool.comfy.isolation.cuda_wheels.package_map]
flash_attn = "flash-attn"
